<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="scan-line-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0)" />
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.4)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>

    <style>
      @keyframes pulseRadar {
        0% { transform: scale(0.6); opacity: 0.8; }
        50% { transform: scale(1.2); opacity: 0.2; }
        100% { transform: scale(1.8); opacity: 0; }
      }
      @keyframes scanSweep {
        0% { transform: translateY(-50px); }
        50% { transform: translateY(360px); }
        100% { transform: translateY(-50px); }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      .radar-circle {
        transform-origin: 1000px 180px;
        animation: pulseRadar 4s ease-out infinite;
      }
      .radar-circle-delay {
        transform-origin: 1000px 180px;
        animation: pulseRadar 4s ease-out infinite 2s;
      }
      .scan-beam {
        animation: scanSweep 6s ease-in-out infinite;
      }
      .node-1 { animation: floatNode 3s ease-in-out infinite; }
      .node-2 { animation: floatNode 4s ease-in-out infinite 1s; }
      .node-3 { animation: floatNode 3.5s ease-in-out infinite 0.5s; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- Animated Radar Element (Positioned in Right Background) -->
  <g opacity="0.4">
    <circle cx="1000" cy="180" r="140" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" />
    <circle cx="1000" cy="180" r="90" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="1000" cy="180" r="40" fill="none" stroke="#38bdf8" stroke-width="1" />
    <circle class="radar-circle" cx="1000" cy="180" r="70" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle class="radar-circle-delay" cx="1000" cy="180" r="70" fill="none" stroke="#818cf8" stroke-width="2" />
  </g>

  <!-- Animated Target Nodes -->
  <g class="node-1" opacity="0.8">
    <circle cx="920" cy="120" r="6" fill="#38bdf8" />
    <line x1="920" y1="120" x2="1000" y2="180" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
  </g>
  <g class="node-2" opacity="0.8">
    <circle cx="1060" cy="110" r="5" fill="#c084fc" />
    <line x1="1060" y1="110" x2="1000" y2="180" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1.5" />
  </g>
  <g class="node-3" opacity="0.8">
    <circle cx="950" cy="240" r="7" fill="#4ade80" />
    <line x1="950" y1="240" x2="1000" y2="180" stroke="rgba(74, 222, 128, 0.3)" stroke-width="1.5" />
  </g>

  <!-- Laser Scan Beam -->
  <rect class="scan-beam" x="0" y="0" width="1200" height="40" fill="url(#scan-line-grad)" opacity="0.6" />

  <!-- Foreground Content Container (Ensures Text Primacy) -->
  <g transform="translate(60, 0)">
    <!-- Badge Pill -->
    <rect x="0" y="55" width="230" height="32" rx="16" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <text x="16" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">🛡️ CYBERSECURITY EASM</text>

    <!-- Main Title -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#text-grad)">Awesome Attack Surface</text>
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff">Management (ASM)</text>

    <!-- Subtitle -->
    <text x="0" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">
      Curated Ecosystem of Enterprise SaaS Platforms &amp; Open-Source Reconnaissance Toolkits
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 268)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="165" height="28" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">🔍 Asset Discovery</text>

      <!-- Pill 2 -->
      <rect x="177" y="0" width="175" height="28" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="189" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">⚡ Exposure Monitoring</text>

      <!-- Pill 3 -->
      <rect x="364" y="0" width="155" height="28" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="376" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">🌐 OSINT Recon</text>
    </g>
  </g>
</svg>
